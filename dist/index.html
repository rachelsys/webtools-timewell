<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>anything — make something useful</title><meta name="description" content="Give anything. Get something useful back."><style>
:root{--ink:#292528;--muted:#817a7e;--line:#e6e0dd;--paper:#fcfbf9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#fff,var(--paper) 48%);color:var(--ink);font:14px Arial,sans-serif}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,5vw,72px)}.brand{font-weight:bold;font-size:17px;display:flex;gap:10px;align-items:center}.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;color:#fff;background:#383235}.note,.history{color:var(--muted);font-size:13px}.dot{display:inline-block;width:6px;height:6px;background:#8bbd9e;border-radius:50%;margin-left:7px}.history{border:0;background:none}.history span{border:1px solid var(--line);border-radius:5px;padding:3px 5px;margin-left:7px;font-size:11px}.workspace{width:min(700px,calc(100% - 40px));margin:auto;padding:clamp(70px,11vh,120px) 0}.intro{text-align:center}.eyebrow{color:#9d8b80;letter-spacing:.16em;font-size:11px;font-weight:bold;margin-bottom:19px}.intro h1{font:500 clamp(43px,7vw,67px)/1 Georgia,serif;letter-spacing:-.055em;margin:0}.lede{color:var(--muted);line-height:1.55;font-size:17px;margin:20px 0 42px}.composer{border:1px solid #d9d0cc;background:#fff;border-radius:17px;box-shadow:0 11px 35px #382b2910;padding:17px}.composer textarea{width:100%;height:74px;border:0;outline:0;resize:none;font:18px Arial}.composer textarea::placeholder{color:#b4adb0}.bottom{display:flex;justify-content:space-between;align-items:center}.tools{color:#a1999b}.tools button{border:0;background:none;color:inherit;font-size:18px;margin-right:7px;cursor:pointer}.tools small{font-size:12px}.send{width:38px;height:38px;border:0;border-radius:11px;background:#3c3538;color:#fff;font-size:20px;cursor:pointer}.send:disabled{background:#d9d2d0}.examples{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;color:#a29a9b;font-size:12px}.examples button{border:1px solid var(--line);background:#fff;border-radius:99px;color:#756c70;padding:7px 11px;cursor:pointer}.quiet{text-align:center;color:#aca4a3;font-size:12px;margin-top:68px}.result{margin-top:44px;border-radius:17px;padding:24px;border:1px solid var(--line);box-shadow:0 14px 35px #382b2912;background:#f0f7f1}.result.lilac{background:#f5f1fa}.result.peach{background:#fff4ec}.result.blue{background:#f0f5f8}.resulthead{display:flex;justify-content:space-between;color:#82777a;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.08em}.copy{border:1px solid #d9d0cc;background:#fff8;color:#776d70;border-radius:8px;padding:7px 9px;font-size:12px}.result h2{font:500 31px Georgia,serif;letter-spacing:-.04em;margin:25px 0 8px}.summary{color:#756d70;line-height:1.5;font-size:15px}.item{display:flex;gap:17px;padding:14px 0;border-top:1px solid #0001}.item b{font:12px Georgia;color:#a79791}.item p{margin:0;font-size:15px}.foot{display:flex;justify-content:space-between;padding-top:19px;color:#8b8081;font-size:12px}.foot button{border:0;background:none;color:#5f5558;cursor:pointer}@media(max-width:600px){.note{display:none}.workspace{padding-top:63px}.lede{font-size:16px;margin-bottom:30px}.examples{justify-content:flex-start}.examples span{display:none}.result{padding:19px}.result h2{font-size:27px}.foot{flex-direction:column;gap:14px}}
</style></head><body><header class="topbar"><div class="brand"><span class="mark">✦</span>anything</div><div class="note">A little clarity, on demand <i class="dot"></i></div><button class="history">History <span>⌘K</span></button></header><section class="workspace"><div class="intro"><p class="eyebrow">THE OPEN-ENDED TOOL</p><h1>Tell me anything.</h1><p class="lede">A thought, a problem, a screenshot, a plan.<br>I’ll figure out what it should become.</p></div><div class="composer"><textarea id="input" placeholder="Drop something in…" aria-label="What would you like help with?"></textarea><div class="bottom"><div class="tools"><button>⌕</button><button>⌁</button><button>↗</button><small>Anything goes</small></div><button id="send" class="send" disabled>↗</button></div></div><div class="examples"><span>Try:</span><button>I keep thinking about quitting my job.</button><button>My flight is at 8:30 tomorrow and I haven’t packed.</button><button>I want to start learning Python.</button><button>Compare these two products for me</button></div><div id="output" class="quiet">✦ &nbsp;No categories. No perfect prompts. Just start.</div></section><script>
const input=document.querySelector('#input'),send=document.querySelector('#send'),out=document.querySelector('#output');const examples=[...document.querySelectorAll('.examples button')];function decide(t){t=t.toLowerCase();if(t.includes('flight')||t.includes('pack'))return['A checklist for tomorrow','Get ready for your flight','A small, calm plan so tomorrow starts without a scramble.',['Check in online and save your boarding pass','Pack essentials: ID, charger, medications, one change of clothes','Set an alarm and plan your route to the airport','Put your bags by the door before bed'],''];if(t.includes('quit')||t.includes('job'))return['A decision framework','Before you decide to leave','You don’t need an answer tonight. Start by separating the signal from the moment.',['What specifically feels unsustainable right now?','If nothing changed for six months, what would you regret?','What would make staying feel meaningfully different?','Name one low-risk experiment you can run this week'],'lilac'];if(t.includes('python')||t.includes('learn'))return['A 4-week learning path','Your first month of Python','A hands-on route from “I’m curious” to building something small.',['Week 1 · Variables, strings, and simple decisions','Week 2 · Loops, lists, and a tiny text game','Week 3 · Functions and working with files','Week 4 · Build a personal tool you’ll actually use'],'peach'];return['A useful next step','Let’s make this concrete','There’s a good idea in here. Here’s the simplest way to move it forward.',['Write down what “done” would look like','Choose the smallest version you could try today','Set a 20-minute timer and make the first rough pass','Come back with what surprised you'],'blue')}function run(){if(!input.value.trim())return;let r=decide(input.value);out.className='result '+r[4];out.innerHTML='<div class="resulthead"><span>✦ &nbsp;'+r[0]+'</span><button class="copy" onclick="this.textContent=\'Copied\'">Copy</button></div><h2>'+r[1]+'</h2><p class="summary">'+r[2]+'</p>'+r[3].map((x,i)=>'<div class="item"><b>0'+(i+1)+'</b><p>'+x+'</p></div>').join('')+'<div class="foot"><span>✦ &nbsp;Made from your messy input</span><button onclick="location.reload()">Start with something else ↗</button></div>'}input.oninput=()=>send.disabled=!input.value.trim();input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}};send.onclick=run;examples.forEach(b=>b.onclick=()=>{input.value=b.textContent;send.disabled=false;run()});
</script><script>document.querySelector('#send').textContent='Make it useful ↗';document.querySelector('#output').textContent='✦  This is not a chat. It makes a useful first version for you.';document.querySelector('.lede').innerHTML='Don’t start a conversation. Start with the mess.<br>I’ll turn it into the thing you need next.';</script></body></html>
