<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒數一下 — anything</title><style>
:root{--ink:#282326;--muted:#8b8184;--line:#e7dfdc;--paper:#fbf9f7;--accent:#e8744f}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 50% -10%,#fff,var(--paper) 58%);font-family:Arial,sans-serif}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,6vw,80px)}.brand{font-weight:bold;font-size:17px}.brand span{display:inline-grid;place-items:center;background:#383235;color:white;width:29px;height:29px;border-radius:9px;margin-right:10px}.back{color:var(--muted);text-decoration:none;font-size:13px}.wrap{width:min(860px,calc(100% - 40px));margin:auto;padding:62px 0}.intro{text-align:center}.eyebrow{font-size:11px;letter-spacing:.17em;color:#b16d58;font-weight:bold}.intro h1{font:500 clamp(40px,6vw,62px) Georgia,serif;letter-spacing:-.05em;margin:14px 0 10px}.intro p{color:var(--muted);font-size:16px;margin:0 0 38px}.layout{display:grid;grid-template-columns:1fr 1.25fr;gap:22px;align-items:stretch}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 14px 36px #36251e0d}.panel h2{font-size:14px;margin:0 0 16px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice{border:1px solid var(--line);background:#fffaf8;border-radius:13px;padding:14px 8px;cursor:pointer;color:#685e61;font-size:14px}.choice b{display:block;font-size:23px;margin-bottom:7px}.choice.active{border-color:#e99a7c;background:#fff0e9;color:#a44d30;box-shadow:0 0 0 3px #fbe0d5}.custom{display:flex;gap:8px;margin-top:17px}.custom input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;outline-color:#e99a7c}.custom button,.mainbtn{border:0;border-radius:10px;padding:0 14px;background:#383235;color:#fff;cursor:pointer}.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffaf6;min-height:330px;position:relative;overflow:hidden}.timer:before{content:"";position:absolute;width:275px;height:275px;border:10px solid #f8ded2;border-top-color:var(--accent);border-radius:50%;transform:rotate(25deg)}.timerface{position:relative;text-align:center}.label{font-size:13px;color:var(--muted);margin-bottom:8px}.time{font:500 clamp(60px,9vw,92px)/1 Georgia,serif;letter-spacing:-.06em}.status{font-size:13px;color:#b06a53;margin-top:8px}.controls{position:relative;display:flex;gap:9px;margin-top:28px}.mainbtn{font-size:15px;padding:12px 28px;background:var(--accent)}.reset{border:1px solid var(--line);background:#fff;color:#776c6e;border-radius:10px;padding:0 17px;cursor:pointer}.tip{text-align:center;color:#a49b9b;font-size:12px;margin-top:26px}.done{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.04)}}@media(max-width:680px){.wrap{padding-top:42px}.layout{grid-template-columns:1fr}.timer{min-height:310px}.choices{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header class="top"><div class="brand"><span>✦</span>anything</div><a class="back" href="/">← 回到 anything</a></header><main class="wrap"><div class="intro"><div class="eyebrow">A SMALL TOOL FOR A SMALL MOMENT</div><h1>倒數一下。</h1><p>選一樣東西，按下開始。剩下的交給時間。</p></div><div class="layout"><section class="panel"><h2>你要等什麼？</h2><div class="choices"><button class="choice active" data-min="3" data-name="泡麵"><b>🍜</b>泡麵</button><button class="choice" data-min="5" data-name="茶"><b>🍵</b>茶</button><button class="choice" data-min="4" data-name="咖啡"><b>☕</b>咖啡</button><button class="choice" data-min="10" data-name="小休息"><b>🫧</b>小休息</button><button class="choice" data-min="25" data-name="專注"><b>◌</b>專注</button><button class="choice" data-min="1" data-name="自訂"><b>✦</b>自訂</button></div><div class="custom"><input id="mins" type="number" min="1" max="180" placeholder="自訂分鐘數"><button id="apply">套用</button></div></section><section class="panel timer"><div class="timerface"><div class="label" id="name">泡麵</div><div class="time" id="time">03:00</div><div class="status" id="status">準備好了嗎？</div></div><div class="controls"><button class="mainbtn" id="start">開始倒數</button><button class="reset" id="reset">重設</button></div></section></div><div class="tip">會在這個分頁裡安靜倒數；完成時會變成「好了！」</div></main><script>
let seconds=180,remaining=180,interval=null,running=false;const q=s=>document.querySelector(s),time=q('#time'),name=q('#name'),status=q('#status'),start=q('#start');function render(){let m=Math.floor(remaining/60),s=remaining%60;time.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function choose(b){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');seconds=Number(b.dataset.min)*60;remaining=seconds;name.textContent=b.dataset.name;status.textContent='準備好了嗎？';running=false;clearInterval(interval);start.textContent='開始倒數';render()}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b));q('#apply').onclick=()=>{let n=Math.max(1,Math.min(180,Number(q('#mins').value)||1));seconds=n*60;remaining=seconds;name.textContent='自訂倒數';status.textContent='自己決定節奏';running=false;clearInterval(interval);start.textContent='開始倒數';render()};start.onclick=()=>{if(running){running=false;clearInterval(interval);start.textContent='繼續倒數';status.textContent='已暫停'}else{if(remaining===0)remaining=seconds;running=true;start.textContent='暫停';status.textContent='正在倒數…';interval=setInterval(()=>{remaining--;render();if(remaining<=0){clearInterval(interval);running=false;start.textContent='再來一次';status.textContent='好了！';q('.timer').classList.add('done');setTimeout(()=>q('.timer').classList.remove('done'),500)}},1000)}};q('#reset').onclick=()=>{clearInterval(interval);running=false;remaining=seconds;start.textContent='開始倒數';status.textContent='準備好了嗎？';render()};render();
</script></body></html>
